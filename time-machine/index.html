<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Time Machine – Historical Capsule</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <!-- Minimal by design: just a mark and the two entry points into the timeline. -->
  <header class="site-header">
    <div class="brand">TIME MACHINE</div>
    <nav class="mode-nav">
      <button class="mode-btn" data-mode="year" type="button">Search by Year</button>
      <span class="nav-divider">|</span>
      <button class="mode-btn" data-mode="decade" type="button">Search by Decade</button>
    </nav>
  </header>

  <main class="stage" id="stage">

    <!-- ===== IDLE STATE ===== -->
    <!-- Shown before either mode is picked. No cards, no dashboard — just an invitation. -->
    <div class="idle-state" id="idle-state">
      <p class="idle-text">Choose how you'd like to explore time</p>
    </div>

    <!-- ===== TIMELINE VIEW ===== -->
    <!-- js/timeline.js fills #timeline-track with <li> items and drives all of the
         scroll / drag / keyboard interaction below. Hidden until a mode is chosen. -->
    <section class="timeline-view" id="timeline-view" hidden>

      <!-- Two stacked layers so the era backdrop can cross-fade instead of jump-cutting. -->
      <div class="timeline-bg" aria-hidden="true">
        <div class="bg-layer" id="bg-layer-a"></div>
        <div class="bg-layer" id="bg-layer-b"></div>
      </div>

      <button class="scroll-arrow left" id="arrow-left" type="button" aria-label="Previous">‹</button>

      <div class="timeline-viewport" id="timeline-viewport">
        <ul class="timeline-track" id="timeline-track"></ul>
      </div>

      <button class="scroll-arrow right" id="arrow-right" type="button" aria-label="Next">›</button>

      <div class="timeline-ruler" aria-hidden="true"></div>

      <div class="enter-panel">
        <button class="enter-btn" id="enter-btn" type="button"></button>
      </div>

    </section>

    <!-- ===== RESULTS VIEW ===== -->
    <!-- Shown after ENTER. js/app.js loads data/history.json once, then fills
         in the hero text and the three local-data sections below. The movie
         grid stays a placeholder until TMDB is wired up in the next stage. -->
    <div class="results-view" id="results-view" hidden>

      <div class="results-backdrop" id="results-backdrop" aria-hidden="true"></div>

      <div class="results-inner">

        <header class="results-hero">
          <p class="results-eyebrow" id="results-eyebrow"></p>
          <h1 class="results-title" id="results-title"></h1>
          <p class="results-description" id="results-description"></p>
        </header>

        <section class="results-section">
          <h2>Historical Events</h2>
          <ul class="results-list" id="events-list"></ul>
        </section>

        <section class="results-section">
          <h2>Music &amp; Culture</h2>
          <ul class="results-list" id="culture-list"></ul>
        </section>

        <section class="results-section">
          <h2>Fun Facts</h2>
          <ul class="results-list" id="facts-list"></ul>
        </section>

        <section class="results-section">
          <h2>Movies</h2>
          <div class="movie-grid" id="movie-grid">
            <p class="movies-placeholder">Movie data arrives once TMDB is wired up in the next stage.</p>
          </div>
        </section>

        <button class="btn-ghost explore-again" id="back-btn" type="button">‹ Explore another time</button>

      </div>
    </div>

  </main>

  <!-- Load order: themes before timeline (timeline calls TimeMachine.getThemeClassForYear),
       then timeline before app (app calls TimeMachine.timeline.start). -->
  <script src="js/api.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
